<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブロック配置アプリケーション (Cube Move)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 右上：ブロック数表示とリセットボタン -->
  <div id="ui">
    <div id="counter">ブロック数: <span id="blockCount">1</span></div>
    <button id="resetBtn">リセット</button>
  </div>
  
  <!-- キャンバス -->
  <canvas id="gameCanvas"></canvas>
  
  <!-- 左下：新規ブロックソース -->
  <div id="palette">
    <div id="draggableBlock" class="block">＋</div>
    <div>新しいブロックをドラッグして配置</div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
